<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUPER account · создание аккаунта</title>
  <style>
    /* Базовый сброс и глобальные стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f1c;
      /* плавный градиентный фон, чтобы стекло "играло" */
      background: radial-gradient(circle at 20% 30%, #1e2a4a, #0a0e1a 80%);
      padding: 1.5rem;
    }

    /* Основной контейнер — эффект жидкого стекла */
    .liquid-glass {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2rem;
      border-radius: 42px;
      /* ключевые свойства для стеклянного эффекта */
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 25px 50px -8px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 20px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }

    /* Дополнительный слой для "жидкого" блика сверху */
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 42px;
      background: radial-gradient(circle at 30% 10%, rgba(255, 255, 255, 0.35) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* чтобы контент был поверх псевдоэлементов */
    .glass-content {
      position: relative;
      z-index: 2;
    }

    /* Заголовок */
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .subhead {
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      backdrop-filter: blur(2px);
    }

    /* Группа полей */
    .input-group {
      margin-bottom: 1.3rem;
      position: relative;
    }

    /* Стили для label — "парящие" подписи */
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 0.5rem;
      padding-left: 0.2rem;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* Поля ввода — полупрозрачные, с эффектом стекла */
    .input-group input {
      width: 100%;
      padding: 0.95rem 1.2rem;
      font-size: 1rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      outline: none;
      backdrop-filter: blur(5px);
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2), 0 0 0 0 rgba(255, 255, 255, 0);
      font-weight: 400;
    }

    /* Плейсхолдер — светлый, но прозрачный */
    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    /* Фокус — свечение и усиление стекла */
    .input-group input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 
        0 0 0 4px rgba(140, 200, 255, 0.2),
        inset 0 2px 12px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
    }

    /* Кнопка регистрации — тоже жидкое стекло, но с акцентным градиентом */
    .liquid-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: white;
      background: linear-gradient(135deg, rgba(120, 180, 255, 0.6), rgba(180, 120, 255, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 40px;
      backdrop-filter: blur(12px);
      cursor: pointer;
      box-shadow: 
        0 12px 30px -10px rgba(0, 0, 0, 0.6),
        inset 0 1px 10px rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* Дополнительный блик на кнопке */
    .liquid-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      transform: rotate(25deg);
    }

    .liquid-btn:hover {
      background: linear-gradient(135deg, rgba(140, 200, 255, 0.8), rgba(200, 140, 255, 0.7));
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 
        0 18px 35px -8px #000,
        inset 0 1px 15px rgba(255, 255, 255, 0.8);
      transform: scale(1.01);
    }

    .liquid-btn:hover::after {
      opacity: 0.6;
    }

    .liquid-btn:active {
      transform: scale(0.98);
      box-shadow: 0 8px 20px -5px #000, inset 0 1px 20px rgba(255, 255, 255, 0.5);
    }

    /* Ссылка "войти" */
    .login-link {
      text-align: center;
      margin-top: 1.6rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.2px;
    }

    .login-link a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 2px;
      transition: all 0.2s;
    }

    .login-link a:hover {
      border-bottom-color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Анимация лёгкого покачивания для "жидкого" эффекта */
    @keyframes liquidFloat {
      0% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.002);
      }
      100% {
        transform: translateY(0px) scale(1);
      }
    }

    .liquid-glass {
      animation: liquidFloat 7s infinite ease-in-out;
      will-change: transform;
    }

    /* Адаптив для мобильных */
    @media (max-width: 480px) {
      .liquid-glass {
        padding: 2rem 1.4rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .input-group input {
        padding: 0.85rem 1rem;
        border-radius: 24px;
      }
      .liquid-btn {
        padding: 0.9rem;
      }
    }

    /* Настройка автозаполнения, чтобы не ломало стиль */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-background-clip: text;
      -webkit-text-fill-color: white;
      transition: background-color 5000s ease-in-out 0s;
      box-shadow: inset 0 0 0 100px rgba(30, 40, 70, 0.8) !important;
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Дополнительные пузырьки/жидкие элементы на фоне (чисто для настроения) */
    .bubble {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), rgba(120, 180, 255, 0.05));
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 18s infinite alternate ease-in-out;
    }

    .bubble:nth-child(1) {
      width: 280px;
      height: 280px;
      top: -70px;
      right: -50px;
      background: radial-gradient(circle at 30% 30%, rgba(150, 200, 255, 0.3), rgba(80, 130, 255, 0.1));
    }

    .bubble:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -120px;
      left: -100px;
      background: radial-gradient(circle at 70% 20%, rgba(200, 160, 255, 0.25), rgba(120, 80, 255, 0.1));
      animation-duration: 22s;
    }

    .bubble:nth-child(3) {
      width: 180px;
      height: 180px;
      top: 40%;
      left: 15%;
      background: radial-gradient(circle at 10% 80%, rgba(255, 220, 150, 0.2), rgba(255, 180, 100, 0.05));
      animation-duration: 14s;
    }

    @keyframes floatBubble {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        transform: translate(40px, -30px) scale(1.1) rotate(10deg);
      }
    }

    /* Стеклянная обводка для контейнера, чтобы усилить эффект */
    .glass-edge {
      position: absolute;
      inset: 0;
      border-radius: 42px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
    }

    /* Стили для чекбокса (согласие с условиями) — тоже стеклянный */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 1.5rem 0 0.2rem;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      accent-color: #9ac7ff;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      cursor: pointer;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }

    .checkbox-group label {
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group a {
      color: #b8d6ff;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed rgba(200, 220, 255, 0.5);
    }

    .checkbox-group a:hover {
      color: white;
      border-bottom-color: white;
    }
  </style>
</head>
<body>
  <!-- Пузырьки для атмосферы liquid -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <!-- Основной стеклянный контейнер -->
  <div class="liquid-glass">
    <!-- Дополнительный слой для кромки (стеклянный кант) -->
    <div class="glass-edge"></div>

    <div class="glass-content">
      <h1>HUPER account - Создать аккаунт</h1>
      <div class="subhead"></div>

      <!-- Форма регистрации -->
      <form id="registerForm" action="#" method="post">
        <!-- Поле: Имя -->
        <div class="input-group">
          <label for="name">Имя пользователя</label>
          <input type="text" id="name" name="name" placeholder="например, alex_liquid" autocomplete="username">
        </div>

        <!-- Поле: Email -->
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="hello@liquid.world" autocomplete="email">
        </div>

        <!-- Поле: Пароль -->
        <div class="input-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <!-- Чекбокс согласия (для реалистичности) -->
        <div class="checkbox-group">
          <input type="checkbox" id="agree" checked>
          <label for="agree">Я принимаю <a href="#">условия</a> и <a href="#">политику конфиденциальности</a></label>
        </div>

        <!-- Кнопка регистрации -->
        <button type="submit" class="liquid-btn">Зарегистрироваться</button>
      </form>

      <!-- Ссылка на вход -->
      <div class="login-link">
        Уже есть аккаунт? <a href="https://seogleru.github.io/huper-search/login.html">Войти</a>
      </div>
    </div>
  </div>

  <script>
    // Небольшая интерактивность: предотвращаем отправку формы для демонстрации
    // (в реальном проекте нужно убрать или изменить)
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      // Можно добавить лёгкую анимацию нажатия или уведомление
      const btn = form.querySelector('.liquid-btn');
      btn.textContent = 'Отправлено ✓';
      btn.style.background = 'linear-gradient(135deg, rgba(150, 255, 180, 0.6), rgba(100, 200, 255, 0.6))';
      setTimeout(() => {
        btn.textContent = 'Зарегистрироваться';
        btn.style.background = 'linear-gradient(135deg, rgba(120, 180, 255, 0.6), rgba(180, 120, 255, 0.5))';
      }, 1500);
      // Опционально: лёгкое дрожание стекла
      const glass = document.querySelector('.liquid-glass');
      glass.style.animation = 'none';
      glass.offsetHeight; // reflow
      glass.style.animation = 'liquidFloat 7s infinite ease-in-out';
    });

    // Дополнительный эффект: при фокусе на полях усиливаем "жидкий" блик (необязательно)
    const inputs = document.querySelectorAll('.input-group input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        const glass = document.querySelector('.liquid-glass');
        glass.style.transition = 'box-shadow 0.3s, border-color 0.3s';
        glass.style.boxShadow = '0 25px 50px -8px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.3), inset 0 1px 30px rgba(255, 255, 255, 0.5)';
        setTimeout(() => {
          glass.style.boxShadow = '0 25px 50px -8px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 1px 20px rgba(255, 255, 255, 0.3)';
        }, 400);
      });
    });
  </script>
</body>
  </html>
